<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>535 DEMO</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 2rem;
            color: #222;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        a {
            text-decoration: none;
            color: #555;
            font-size: 1.2rem;
            padding: 0.8rem 2rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.2s ease;
            background-color: white;
        }
        a:hover {
            color: #000;
            border-color: #999;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>535 DEMO</h1>
        <div class="nav-links">
            <a href="map/">Map</a>
            <a href="dashboard/">Dashboard</a>
        </div>
    </div>
</body>
</html>
